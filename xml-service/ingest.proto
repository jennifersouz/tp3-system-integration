syntax = "proto3";

package xmlservice;

option go_package = "xmlservice/pb";

// Service para ingestão de CSV via gRPC (Protocolo 4)
service IngestService {
  rpc IngestCSV(IngestRequest) returns (IngestResponse);
}

message IngestRequest {
  string idRequisicao = 1;
  string mapperVersion = 2;
  string webhookUrl = 3;
  double taxRate = 4;
  bytes csvData = 5;  // Dados do CSV em binary
}

message IngestResponse {
  string idRequisicao = 1;
  string status = 2;  // OK | ERRO_VALIDACAO | ERRO_PERSISTENCIA
  int64 documentId = 3;
  string error = 4;
}
