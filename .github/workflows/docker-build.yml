name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            VERSION=latest
          else
            VERSION=${{ github.ref_name }}-${{ github.sha | cut -c1-7 }}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # Build and push each service
      - name: Build and push xml-service
        uses: docker/build-push-action@v5
        with:
          context: ./xml-service
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/tp3-xml-service:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/tp3-xml-service:latest

      - name: Build and push processor
        uses: docker/build-push-action@v5
        with:
          context: ./processor
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/tp3-processor:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/tp3-processor:latest

      - name: Build and push crawler
        uses: docker/build-push-action@v5
        with:
          context: ./crawler-python
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/tp3-crawler:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/tp3-crawler:latest

      - name: Build and push external-api
        uses: docker/build-push-action@v5
        with:
          context: ./external-api
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/tp3-external-api:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/tp3-external-api:latest

      - name: Build and push bi-service
        uses: docker/build-push-action@v5
        with:
          context: ./bi-service-node
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/tp3-bi-service:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/tp3-bi-service:latest
